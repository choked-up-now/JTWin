[package]
name = "jituan"
version = "0.9.0"
edition = "2024"

[lib]
name = "jituan_core"
path = "src/lib.rs"

[[bin]]
name = "jituan-cli"
path = "src/bin/jituan-cli.rs"
required-features = ["cli"]

[[bin]]
name = "jituan-gui"
path = "src/bin/jituan-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "http2", "native-tls", "json"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.26"
tempfile = "3.20.0"
dirs = "5.0"
rfd = "0.14"
opener = "0.7"
regex = "1.11"
percent-encoding = "2.3"

# 可选依赖 (P2P 相关)
bendy = { version = "0.5", features = ["serde"], optional = true }
sha1 = { version = "0.10", optional = true }
serde_bytes = { version = "0.11", optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2.5", optional = true }
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
rc4 = { version = "0.1", optional = true }

# 可选依赖 (GUI/CLI)
clap = { version = "4.5", features = ["derive"], optional = true }
eframe = { version = "0.28", optional = true }

[features]
default = []
cli = ["dep:clap"]
gui = ["dep:eframe"]
p2p = [
    "dep:bendy", "dep:sha1", "dep:serde_bytes",
    "dep:rand", "dep:url", "dep:num-bigint", "dep:num-traits", "dep:rc4"
]
full = ["cli", "gui", "p2p"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3